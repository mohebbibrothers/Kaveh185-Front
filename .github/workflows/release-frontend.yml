name: Release frontend bundle

# چرا این گردش‌کار؟
# ─────────────────
# خروجی ایستا باید **یک‌جا** ساخته شود و همان‌جا تأیید شود؛ روی هاست نه
# Node هست نه pnpm (و نه حتی python3). پس بسته اینجا ساخته، دروازه‌زنی و
# به‌عنوان داراییِ انتشار گیت‌هاب منتشر می‌شود.
#
# نتیجه برای اپراتور روی هاست، فقط یک فرمان:
#
#   bash ~/Kaveh185-Back/deploy/front-deploy.sh --url \
#     https://github.com/mohebbibrothers/Kaveh185-Front/releases/latest/download/frontend.tar.gz
#
# نام دارایی عمداً ثابت است (frontend.tar.gz) تا لازم نباشد هش را در نشانی
# بنویسید؛ شناسهٔ نسخه در سرآیند X-Frontend-Build و در BUILD_ID داخل بسته
# هست و اسکریپت استقرار خودش تطبیق می‌دهد.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ساخت و انتشار بسته
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: نصب وابستگی‌ها
        run: pnpm install --frozen-lockfile

      - name: دروازه‌های کیفیت
        run: |
          pnpm run tokens:check
          pnpm run api:types -- --check
          pnpm run lint
          pnpm run typecheck
          pnpm run test

      - name: ساخت خروجی ایستا
        env:
          # سایت و API هم‌مبدأ هستند؛ این‌ها فقط متادیتا و نشانی canonical‌اند.
          NEXT_PUBLIC_SITE_URL: https://kaveh185.ir
          NEXT_PUBLIC_API_ORIGIN: https://kaveh185.ir
        run: |
          pnpm run build
          pnpm run budget

      # ⚠️ دروازهٔ حیاتی: بیلد ایستا نباید هیچ داده‌ای از API در خود داشته
      # باشد. یک‌بار همین اتفاق افتاد — `next build` در زمان ساخت از یک
      # بک‌اند آزمایشی خواند و عدد seed («۱ مشارکت» برای هر مسجد، سهم
      # ۵.۹٪، «آزمون فعال است») در HTML منتشرشده پخت. API واقعی همان
      # لحظه صفر می‌گفت.
      #
      # حالا کد هیچ fetchی در زمان ساخت ندارد؛ این گام اگر روزی کسی آن را
      # برگرداند، انتشار را متوقف می‌کند — نه این‌که اعداد جعلی منتشر شود.
      - name: دروازهٔ «هیچ دادهٔ پخته‌شده»
        run: |
          set -euo pipefail
          fail=0
          flat="$(tr -d '\\' < out/index.html)"
          check() { # pattern | description
            if printf '%s' "$flat" | grep -qE "$1"; then
              echo "::error::$2"
              fail=1
            else
              echo "OK — $2"
            fi
          }
          check '"starts_at"[[:space:]]*:[[:space:]]*"[0-9]'              'تاریخ واقعی آزمون در HTML پخته شده'
          check '"total_completed_participants"[[:space:]]*:[[:space:]]*[1-9]' 'عدد مشارکت در HTML پخته شده'
          check 'MSQ-[0-9]{2}'                                            'فهرست مساجد در HTML پخته شده'
          check '"total_mosques"[[:space:]]*:[[:space:]]*[1-9]'            'تعداد مساجد در HTML پخته شده'
          if grep -qE 'apiGet[[:space:]]*\(|await fetch\(' src/app/page.tsx; then
            echo "::error::صفحهٔ اول در زمان ساخت API صدا می‌زند"
            fail=1
          else
            echo "OK — صفحهٔ اول در زمان ساخت هیچ درخواستی نمی‌زند"
          fi
          exit "$fail"

      - name: بسته‌بندی + دروازهٔ محتوا
        run: pnpm run pack:front

      - name: نام ثابت دارایی
        run: |
          SRC="$(ls -1 release/frontend-*.tar.gz | head -1)"
          cp "$SRC" release/frontend.tar.gz
          cp "$SRC.sha256" release/frontend.tar.gz.sha256
          sed -i "s|$(basename "$SRC")|frontend.tar.gz|" release/frontend.tar.gz.sha256
          echo "── محتوای بسته ──"
          cat release/frontend.tar.gz.sha256
          echo "── شناسهٔ نسخه ──"
          cat out/BUILD_ID

      - name: انتشار به‌عنوان دارایی Release
        uses: softprops/action-gh-release@v2
        with:
          # برچسب «تازه‌ترین بستهٔ main». `latest` همیشه به همین اشاره می‌کند،
          # پس نشانی دانلود در اسکریپت هاست هیچ‌وقت عوض نمی‌شود.
          tag_name: frontend-latest
          name: Frontend bundle (latest)
          body: |
            بستهٔ فرانت ایستای کاوه ۱۸۵ — ساخته‌شده از `${{ github.sha }}`.

            روی هاست:
            ```
            bash ~/Kaveh185-Back/deploy/front-deploy.sh --url \
              https://github.com/${{ github.repository }}/releases/latest/download/frontend.tar.gz
            ```
          files: |
            release/frontend.tar.gz
            release/frontend.tar.gz.sha256
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: نگه‌داشتن بسته برای عیب‌یابی
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bundle
          path: |
            release/frontend.tar.gz
            release/frontend.tar.gz.sha256
            out/BUILD_ID
          retention-days: 14
